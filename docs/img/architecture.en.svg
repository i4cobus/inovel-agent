<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="804" viewBox="0 0 1000 804" font-family='-apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", Helvetica, Arial, sans-serif'><defs><marker id="ae" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b665e"/></marker></defs><rect width="1000" height="804" fill="#faf8f3"/><rect x="20" y="30" width="960" height="262" rx="10" fill="none" stroke="#6b7a3a" stroke-width="1.6"/><text x="40" y="54" font-size="14" font-weight="700" fill="#6b7a3a">Offline · once per book, written to disk</text><rect x="40" y="84" width="70" height="40" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="52" y="104" font-size="13" fill="#6b7a3a" font-weight="600">text</text><line x1="110" y1="104" x2="148" y2="104" stroke="#6b665e" stroke-width="1.4" marker-end="url(#ae)"/><rect x="150" y="76" width="120" height="56" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="162" y="96" font-size="13" fill="#6b7a3a" font-weight="600">digest</text><text x="162" y="114" font-size="12" fill="#6b665e">~40k chars</text><rect x="320" y="70" width="350" height="56" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="332" y="90" font-size="13" fill="#6b7a3a" font-weight="600">Book card: an LLM fills a closed three-layer vocabulary</text><text x="332" y="108" font-size="12" fill="#6b665e">genre 12/41 · 40 elements (quote-verified) · 5 style scales</text><rect x="320" y="148" width="350" height="56" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="332" y="168" font-size="13" fill="#6b7a3a" font-weight="600">Multi-vector index: paragraph chunks + card section</text><text x="332" y="186" font-size="12" fill="#6b665e">Qwen3-Embedding-4B, 294,485 vectors</text><rect x="700" y="148" width="260" height="56" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="712" y="168" font-size="13" fill="#6b7a3a" font-weight="600">Single-vector index: pooled per kind</text><text x="712" y="186" font-size="12" fill="#6b665e">one vector per book; search_books uses it</text><path d="M270,104 H295 V98 H318" fill="none" stroke="#6b665e" stroke-width="1.4" marker-end="url(#ae)"/><path d="M270,104 H295 V176 H318" fill="none" stroke="#6b665e" stroke-width="1.4" marker-end="url(#ae)"/><line x1="670" y1="176" x2="698" y2="176" stroke="#6b665e" stroke-width="1.4" marker-end="url(#ae)"/><text x="150" y="254" font-size="12" fill="#6b7a3a" text-anchor="start">also derived:</text><rect x="320" y="226" width="170" height="52" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="332" y="246" font-size="13" fill="#6b7a3a" font-weight="600">Term densities</text><text x="332" y="264" font-size="12" fill="#6b665e">full text, for check_term</text><rect x="510" y="226" width="160" height="52" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="522" y="246" font-size="13" fill="#6b7a3a" font-weight="600">Profile table</text><text x="522" y="264" font-size="12" fill="#6b665e">card + synopsis + opening</text><line x1="500" y1="292" x2="500" y2="330" stroke="#6b665e" stroke-width="1.4" marker-end="url(#ae)"/><text x="512" y="315" font-size="12" fill="#6b665e" text-anchor="start">shared backends: encoder, both indexes, profiles, densities, judge</text><rect x="20" y="332" width="960" height="262" rx="10" fill="none" stroke="#b5452f" stroke-width="1.6"/><text x="40" y="356" font-size="14" font-weight="700" fill="#b5452f">Online · a model is called only while someone is talking</text><rect x="40" y="372" width="560" height="196" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="52" y="392" font-size="13" fill="#b5452f" font-weight="600">agent loop (Qwen3.8-Flash, OpenAI-compatible tool calling)</text><text x="56" y="418" font-size="13" fill="#b5452f" font-weight="600">find</text><text x="118" y="418" font-size="13" fill="#2b2a28">search_books (hard card filters) · similar_books</text><text x="56" y="439" font-size="13" fill="#b5452f" font-weight="600">verify</text><text x="118" y="439" font-size="13" fill="#2b2a28">check_term (density rule) · check_trope (card first, then text)</text><text x="56" y="460" font-size="13" fill="#b5452f" font-weight="600">read</text><text x="118" y="460" font-size="13" fill="#2b2a28">get_profile · ask_book (in-book passage retrieval, chapter citations)</text><text x="56" y="481" font-size="13" fill="#b5452f" font-weight="600">talk</text><text x="118" y="481" font-size="13" fill="#2b2a28">set_aside · memory_read / memory_write · finish</text><text x="56" y="502" font-size="13" fill="#b5452f" font-weight="600">memory</text><text x="118" y="502" font-size="13" fill="#2b2a28">long-term entries persist and enter the system prompt; one-off ones do not</text><text x="56" y="523" font-size="13" fill="#b5452f" font-weight="600">bounds</text><text x="118" y="523" font-size="13" fill="#2b2a28">≤10 steps per turn; tool results budgeted; only the last 8 turns replayed</text><rect x="660" y="372" width="300" height="88" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="672" y="392" font-size="13" fill="#b5452f" font-weight="600">Session = a fork of the loop</text><text x="672" y="410" font-size="12" fill="#6b665e">its own memory file, numbered picks, transcript</text><text x="672" y="428" font-size="12" fill="#6b665e">under data/sessions/&lt;id&gt;/, restored on restart</text><rect x="660" y="480" width="300" height="88" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="672" y="500" font-size="13" fill="#b5452f" font-weight="600">UI: Starlette + one page</text><text x="672" y="518" font-size="12" fill="#6b665e">tool calls and results streamed (SSE)</text><text x="672" y="536" font-size="12" fill="#6b665e">click a title for its card</text><line x1="600" y1="416" x2="658" y2="416" stroke="#6b665e" stroke-width="1.4" marker-end="url(#ae)"/><line x1="810" y1="460" x2="810" y2="478" stroke="#6b665e" stroke-width="1.4" marker-end="url(#ae)"/><line x1="500" y1="594" x2="500" y2="632" stroke="#6b665e" stroke-width="1.4" marker-end="url(#ae)"/><rect x="20" y="634" width="960" height="150" rx="10" fill="none" stroke="#2f6f73" stroke-width="1.6"/><text x="40" y="658" font-size="14" font-weight="700" fill="#2f6f73">Evaluation · two stages scored apart so failures can be attributed</text><rect x="40" y="674" width="450" height="90" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="52" y="694" font-size="13" fill="#2f6f73" font-weight="600">Index stage: candidate supply</text><text x="52" y="712" font-size="12" fill="#6b665e">queries the agent actually emitted</text><text x="52" y="730" font-size="12" fill="#6b665e">top-k positive precision, feasibility, card consistency</text><rect x="510" y="674" width="450" height="90" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="522" y="694" font-size="13" fill="#2f6f73" font-weight="600">Agent stage: constrained recommendation + memory</text><text x="522" y="712" font-size="12" fill="#6b665e">program-checked: picks, provenance, per-book checks, violations</text><text x="522" y="730" font-size="12" fill="#6b665e">75 test tasks: Flash 0.867, 9B arm 0.227</text></svg>