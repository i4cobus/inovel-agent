<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="804" viewBox="0 0 1000 804" font-family='-apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", Helvetica, Arial, sans-serif'><defs><marker id="ae" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b665e"/></marker></defs><rect width="1000" height="804" fill="#faf8f3"/><rect x="20" y="30" width="960" height="262" rx="10" fill="none" stroke="#6b7a3a" stroke-width="1.6"/><text x="40" y="54" font-size="14" font-weight="700" fill="#6b7a3a">离线层 · 每本书跑一次，产物落盘</text><rect x="40" y="84" width="70" height="40" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="52" y="104" font-size="13" fill="#6b7a3a" font-weight="600">原文</text><line x1="110" y1="104" x2="148" y2="104" stroke="#6b665e" stroke-width="1.4" marker-end="url(#ae)"/><rect x="150" y="76" width="120" height="56" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="162" y="96" font-size="13" fill="#6b7a3a" font-weight="600">digest</text><text x="162" y="114" font-size="12" fill="#6b665e">约 4 万字</text><rect x="320" y="70" width="350" height="56" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="332" y="90" font-size="13" fill="#6b7a3a" font-weight="600">书卡：LLM 按三层封闭词表填卡</text><text x="332" y="108" font-size="12" fill="#6b665e">题材 12/41 · 元素 40（附原文摘录核对）· 风格五维</text><rect x="320" y="148" width="350" height="56" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="332" y="168" font-size="13" fill="#6b7a3a" font-weight="600">多向量索引：段落切块 + 书卡段</text><text x="332" y="186" font-size="12" fill="#6b665e">Qwen3-Embedding-4B，294,485 个向量</text><rect x="700" y="148" width="260" height="56" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="712" y="168" font-size="13" fill="#6b7a3a" font-weight="600">单向量索引：按段类均值再加权</text><text x="712" y="186" font-size="12" fill="#6b665e">一本书一个向量，search_books 用它</text><path d="M270,104 H295 V98 H318" fill="none" stroke="#6b665e" stroke-width="1.4" marker-end="url(#ae)"/><path d="M270,104 H295 V176 H318" fill="none" stroke="#6b665e" stroke-width="1.4" marker-end="url(#ae)"/><line x1="670" y1="176" x2="698" y2="176" stroke="#6b665e" stroke-width="1.4" marker-end="url(#ae)"/><text x="150" y="254" font-size="12" fill="#6b7a3a" text-anchor="start">其他产物：</text><rect x="320" y="226" width="170" height="52" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="332" y="246" font-size="13" fill="#6b7a3a" font-weight="600">词频表</text><text x="332" y="264" font-size="12" fill="#6b665e">全文词频，check_term 用</text><rect x="510" y="226" width="160" height="52" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="522" y="246" font-size="13" fill="#6b7a3a" font-weight="600">档案表</text><text x="522" y="264" font-size="12" fill="#6b665e">书卡 + 简介 + 开头</text><line x1="500" y1="292" x2="500" y2="330" stroke="#6b665e" stroke-width="1.4" marker-end="url(#ae)"/><text x="512" y="315" font-size="12" fill="#6b665e" text-anchor="start">共享后端：编码器、两套索引、档案表、词频表、judge</text><rect x="20" y="332" width="960" height="262" rx="10" fill="none" stroke="#b5452f" stroke-width="1.6"/><text x="40" y="356" font-size="14" font-weight="700" fill="#b5452f">在线层 · 对话时才调模型</text><rect x="40" y="372" width="560" height="196" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="52" y="392" font-size="13" fill="#b5452f" font-weight="600">agent loop（Qwen3.8-Flash，OpenAI 兼容 tool calling）</text><text x="56" y="418" font-size="13" fill="#b5452f" font-weight="600">找书</text><text x="104" y="418" font-size="13" fill="#2b2a28">search_books（书卡硬过滤）· similar_books</text><text x="56" y="439" font-size="13" fill="#b5452f" font-weight="600">核查</text><text x="104" y="439" font-size="13" fill="#2b2a28">check_term（词频规则）· check_trope（先书卡后原文）</text><text x="56" y="460" font-size="13" fill="#b5452f" font-weight="600">了解</text><text x="104" y="460" font-size="13" fill="#2b2a28">get_profile · ask_book（书内段落检索，章节引用）</text><text x="56" y="481" font-size="13" fill="#b5452f" font-weight="600">对话</text><text x="104" y="481" font-size="13" fill="#2b2a28">set_aside · memory_read / memory_write · finish</text><text x="56" y="502" font-size="13" fill="#b5452f" font-weight="600">记忆</text><text x="104" y="502" font-size="13" fill="#2b2a28">长期条目持久化并每轮写进系统提示；仅本次的不持久化</text><text x="56" y="523" font-size="13" fill="#b5452f" font-weight="600">兜底</text><text x="104" y="523" font-size="13" fill="#2b2a28">每轮最多 10 步；工具结果有字符预算；跨轮只重放最近 8 轮</text><rect x="660" y="372" width="300" height="88" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="672" y="392" font-size="13" fill="#b5452f" font-weight="600">会话 = loop 的一个分叉</text><text x="672" y="410" font-size="12" fill="#6b665e">自己的记忆文件、已推荐编号、对话记录</text><text x="672" y="428" font-size="12" fill="#6b665e">存在 data/sessions/&lt;id&gt;/，重启后恢复</text><rect x="660" y="480" width="300" height="88" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="672" y="500" font-size="13" fill="#b5452f" font-weight="600">界面：Starlette + 单页</text><text x="672" y="518" font-size="12" fill="#6b665e">工具调用与结果逐步推送（SSE）</text><text x="672" y="536" font-size="12" fill="#6b665e">点书名看书卡</text><line x1="600" y1="416" x2="658" y2="416" stroke="#6b665e" stroke-width="1.4" marker-end="url(#ae)"/><line x1="810" y1="460" x2="810" y2="478" stroke="#6b665e" stroke-width="1.4" marker-end="url(#ae)"/><line x1="500" y1="594" x2="500" y2="632" stroke="#6b665e" stroke-width="1.4" marker-end="url(#ae)"/><rect x="20" y="634" width="960" height="150" rx="10" fill="none" stroke="#2f6f73" stroke-width="1.6"/><text x="40" y="658" font-size="14" font-weight="700" fill="#2f6f73">评测层 · 两层分开评，失败才能归因</text><rect x="40" y="674" width="450" height="90" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="52" y="694" font-size="13" fill="#2f6f73" font-weight="600">索引阶段：候选供给</text><text x="52" y="712" font-size="12" fill="#6b665e">查询取 agent 真实发出的检索词</text><text x="52" y="730" font-size="12" fill="#6b665e">top-k 正向精确率、可行性、卡一致率</text><rect x="510" y="674" width="450" height="90" rx="6" fill="#ffffff" stroke="#cfc9bd" stroke-width="1.2"/><text x="522" y="694" font-size="13" fill="#2f6f73" font-weight="600">agent 阶段：约束推荐 + 跨轮记忆</text><text x="522" y="712" font-size="12" fill="#6b665e">程序判分：推荐数、来源、逐本核查、规则违反</text><text x="522" y="730" font-size="12" fill="#6b665e">test 75 条：Flash 0.867，9B 对照 0.227</text></svg>