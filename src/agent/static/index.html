<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网文 agent</title>
<style>
  :root {
    --paper: #f3eee4; --panel: #faf7f1; --line: #ddd4c4; --ink: #2a2521; --muted: #7d7368; --faint: #a69c8f;
    --accent: #9c3f1e; --accent-soft: #efe0d2; --user: #e8e1d3; --warn: #a33a2a;
    --teal: #3d6b68; --teal-soft: #dfe9e6; --olive: #6f6a2e; --olive-soft: #ebe8d6;
    --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "Noto Serif SC", "STSong", "SimSun", Georgia, "Times New Roman", serif;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #161411; --panel: #1d1a16; --line: #35302a; --ink: #e9e2d5; --muted: #9f9588; --faint: #6f675d; --accent: #d9956c; --accent-soft: #3a2a1e; --user: #262f28; --warn: #d4654f; --teal: #8fc2bd; --teal-soft: #1f2d2c; --olive: #c9c37a; --olive-soft: #2b2a1c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 16px; line-height: 1.75; height: 100vh; display: grid; grid-template-columns: 240px 1fr 260px; }
  aside, section, main { min-height: 0; }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .brand { padding: 22px 20px 12px; font-size: 20px; letter-spacing: .04em; }
  .brand small { display: block; color: var(--faint); font-size: 12px; letter-spacing: 0; font-family: var(--mono); margin-top: 2px; }
  .new { margin: 4px 16px 12px; padding: 8px 12px; border: 1px solid var(--line); background: transparent; color: var(--accent); border-radius: 6px; cursor: pointer; font: inherit; font-size: 15px; }
  .new:hover { border-color: var(--accent); }
  .sessions { overflow-y: auto; flex: 1; }
  .session { padding: 10px 20px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; border-left: 3px solid transparent; }
  .session:hover { background: var(--panel); }
  .session.active { border-left-color: var(--accent); background: var(--panel); }
  .session .t { flex: 1; min-width: 0; }
  .session .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
  .session .meta { color: var(--faint); font-size: 12px; }
  .session .del { border: 0; background: none; color: var(--faint); cursor: pointer; font-size: 15px; padding: 0 2px; font-family: var(--serif); opacity: 0; }
  .session:hover .del { opacity: 1; }
  .session .del:hover { color: var(--warn); }
  main { display: flex; flex-direction: column; }
  header { padding: 18px 28px 10px; display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log { flex: 1; overflow-y: auto; padding: 8px 28px 24px; display: flex; flex-direction: column; gap: 20px; }
  .msg { max-width: 760px; }
  .msg.user { align-self: flex-end; background: var(--user); padding: 8px 16px; border-radius: 14px 14px 3px 14px; white-space: pre-wrap; }
  .msg.agent { align-self: flex-start; width: 100%; }
  .answer { white-space: pre-wrap; padding: 2px 0; }
  .answer.asks::before { content: "问 "; color: var(--accent); }
  a.book { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); cursor: pointer; }
  a.book:hover { background: var(--accent-soft); }
  .recs { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .recs a.book { margin-right: 10px; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 100vw; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0,0,0,.08); transform: translateX(100%); transition: transform .2s ease; overflow-y: auto; padding: 24px 26px 32px; z-index: 10; }
  #panel.open { transform: none; }
  #panel .close { position: absolute; top: 14px; right: 16px; border: 0; background: none; color: var(--faint); font: inherit; font-size: 20px; cursor: pointer; }
  #panel h3 { margin: 0 0 2px; font-size: 22px; font-weight: 500; }
  #panel .genre { color: var(--muted); margin-bottom: 12px; }
  #panel .why { border-left: 2px solid var(--accent); padding-left: 10px; color: var(--ink); margin: 10px 0 16px; font-size: 15px; }
  #panel h4 { font-size: 12px; margin: 18px 0 6px; font-weight: 500; letter-spacing: .1em; display: flex; align-items: center; gap: 8px; }
  #panel h4::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: .25; }
  #panel .sec-el h4 { color: var(--accent); }
  #panel .sec-el .tag { border-color: transparent; background: var(--accent-soft); color: var(--accent); }
  #panel .sec-style h4 { color: var(--teal); }
  #panel .sec-style .row .k { color: var(--teal); }
  #panel .sec-style .row .v { background: var(--teal-soft); border-radius: 4px; padding: 0 7px; }
  #panel .sec-card h4 { color: var(--olive); }
  #panel .sec-card .row .k { color: var(--olive); }
  #panel .sec-blurb h4 { color: var(--muted); }
  #panel .row { font-size: 14px; display: flex; gap: 10px; align-items: baseline; margin: 3px 0; }
  #panel .row .k { flex: 0 0 4em; font-size: 13px; }
  #panel .row .v { flex: 1; min-width: 0; }
  #panel .blurb { font-size: 14px; color: var(--muted); white-space: pre-wrap; line-height: 1.7; background: var(--paper); border-radius: 6px; padding: 10px 12px; }
  .live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 8px; animation: pulse 1.2s infinite; vertical-align: middle; }
  @keyframes pulse { 50% { opacity: .15; } }
  form { display: flex; gap: 10px; padding: 14px 28px 20px; }
  textarea { flex: 1; resize: none; height: 60px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font: inherit; line-height: 1.6; background: var(--panel); color: var(--ink); }
  textarea:focus { outline: none; border-color: var(--accent); }
  button.send { padding: 0 22px; border: 0; border-radius: 8px; background: var(--accent); color: #fbf7f0; font: inherit; cursor: pointer; }
  button.send:disabled { opacity: .4; cursor: default; }
  section.side { border-left: 1px solid var(--line); overflow-y: auto; padding: 22px 20px; font-size: 14px; }
  section.side h2 { font-size: 12px; color: var(--faint); margin: 18px 0 6px; font-weight: 500; letter-spacing: .1em; }
  section.side h2:first-child { margin-top: 0; }
  .tag { display: inline-block; border: 1px solid var(--line); border-radius: 4px; padding: 0 7px; margin: 2px 4px 2px 0; }
  .tag.off { color: var(--muted); border-style: dashed; }
  .kind { color: var(--muted); margin-right: 4px; }
  ol.recs-list { margin: 0; padding-left: 20px; }
  .empty { color: var(--faint); }
  .welcome { margin: auto; color: var(--faint); text-align: center; max-width: 400px; }
  @media (max-width: 1000px) { body { grid-template-columns: 200px 1fr; } section.side { display: none; } }
  @media (max-width: 640px) { body { grid-template-columns: 1fr; } aside { display: none; } header, .log, form { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<aside>
  <div class="brand">网文 agent<small id="model">…</small></div>
  <button class="new" id="new">新会话</button>
  <div class="sessions" id="sessions"></div>
</aside>
<main>
  <header><h1 id="title"></h1></header>
  <div class="log" id="log"><div class="welcome">每个会话有自己的记忆与上下文。换一类书，另开一个。</div></div>
  <form id="form">
    <textarea id="input" placeholder="想看什么书" disabled></textarea>
    <button class="send" id="send" type="submit" disabled>发送</button>
  </form>
</main>
<div id="panel"><button class="close" id="panel-close">×</button><div id="panel-body"></div></div>
<section class="side">
  <h2>记忆</h2><div id="memory" class="empty">—</div>
  <h2>已推荐</h2><div id="recommended" class="empty">—</div>
  <h2>已排除</h2><div id="excluded" class="empty">—</div>
</section>
<script>
const $ = (id) => document.getElementById(id);
const state = { sessions: [], current: null, busy: false };
const KIND = { positive: "喜欢", negative: "不要", read: "读过", note: "备注" };

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (r.status === 204) return null;
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const when = (iso) => iso ? new Date(iso).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";

async function loadInfo() {
  try {
    const info = await api("/api/info");
    $("model").textContent = info.model || "";
  } catch (e) { $("model").textContent = "未连接"; }
}

async function loadSessions() {
  state.sessions = (await api("/api/sessions")).sessions;
  renderSessions();
}
function renderSessions() {
  const box = $("sessions");
  box.innerHTML = "";
  for (const s of state.sessions) {
    const el = document.createElement("div");
    el.className = "session" + (state.current && s.id === state.current.id ? " active" : "");
    el.innerHTML = `<div class="t"><div class="title">${esc(s.title || "新会话")}</div><div class="meta">${when(s.updated_at)}</div></div><button class="del" title="删除">×</button>`;
    el.querySelector(".t").onclick = () => openSession(s.id);
    el.querySelector(".del").onclick = async (ev) => {
      ev.stopPropagation();
      if (!confirm(`删除「${s.title || "新会话"}」？`)) return;
      await api(`/api/sessions/${s.id}`, { method: "DELETE" });
      if (state.current && state.current.id === s.id) { state.current = null; renderSession(); }
      await loadSessions();
    };
    box.appendChild(el);
  }
}

async function newSession() {
  const s = await api("/api/sessions", { method: "POST", body: "{}" });
  await loadSessions();
  await openSession(s.id);
  $("input").focus();
}
async function openSession(id) {
  state.current = await api(`/api/sessions/${id}`);
  renderSessions();
  renderSession();
}

function renderSession() {
  const s = state.current;
  const log = $("log");
  $("title").textContent = s ? (s.title || "新会话") : "";
  $("input").disabled = $("send").disabled = !s || state.busy;
  log.innerHTML = "";
  if (!s) { log.innerHTML = '<div class="welcome">每个会话有自己的记忆与上下文。换一类书，另开一个。</div>'; renderSide(null); return; }
  if (!s.turns.length) log.innerHTML = '<div class="welcome">说说想看什么。</div>';
  for (const t of s.turns) { log.appendChild(userBubble(t.user)); log.appendChild(agentBubble(t)); }
  renderSide(s);
  log.scrollTop = log.scrollHeight;
}

function userBubble(text) { const d = document.createElement("div"); d.className = "msg user"; d.textContent = text; return d; }

const bare = (t) => String(t || "").replace(/^[《「]+|[》」]+$/g, "");
function chip(r) { return `<a class="book" data-id="${esc(r.novel_id)}" data-why="${esc(r.reason || "")}">《${esc(bare(r.title) || r.novel_id)}》</a>`; }
function answerHtml(answer, recs) {
  // Every 《title》 of a recommended book becomes a chip in place; books the text never names are listed after it.
  let html = esc(answer);
  const missing = [];
  for (const r of recs) {
    const title = bare(r.title);
    if (!title) continue;
    const needle = esc(`《${title}》`);
    if (html.includes(needle)) html = html.split(needle).join(chip(r));
    else missing.push(r);
  }
  return { html, missing };
}
function agentBubble(turn, live = false) {
  const d = document.createElement("div");
  d.className = "msg agent";
  const st = turn.structured || {};
  const recs = st.recommendations || [];
  const { html, missing } = answerHtml(turn.answer || (turn.error ? "出错：" + turn.error : "没有回答"), recs);
  const cites = (st.citations || []).map((c) => `${esc(c.novel_id)} ${esc(c.chapter)}`).join("；");
  const bad = turn.termination && turn.termination !== "finish";
  const meta = [`${turn.steps.length} 步`, turn.elapsed_s ? `${turn.elapsed_s} s` : ""].filter(Boolean).join(" · ");
  d.innerHTML = `
    ${live ? "" : `<div class="answer${st.asks_user ? " asks" : ""}">${html}</div>`}
    ${missing.length ? `<div class="recs">另外推荐 ${missing.map(chip).join("")}</div>` : ""}
    ${cites ? `<div class="cites">出处 ${cites}</div>` : ""}
    <details class="trace" ${live ? "open" : ""}><summary>${live ? '<span class="live"></span>' : ""}${live ? "处理中" : "过程"} · ${meta}</summary><div class="steps">${turn.steps.map(stepHtml).join("")}</div></details>
    ${bad ? `<div class="status">未正常结束：${esc(turn.termination)}${turn.error ? " · " + esc(turn.error) : ""}</div>` : ""}`;
  return d;
}
function argText(args) {
  const parts = [];
  for (const [k, v] of Object.entries(args || {})) {
    if (v == null || typeof v === "boolean" || k === "k") continue;
    const text = Array.isArray(v) ? (v.some((x) => typeof x === "object") ? `${v.length} 项` : v.map(String).join("、")) : (typeof v === "object" ? "" : String(v));
    if (text) parts.push(text.length > 48 ? text.slice(0, 47) + "…" : text);
  }
  return parts.join(" · ");
}
function stepHtml(step) {
  const calls = step.calls.filter((c) => c.name !== "finish").map((c) => {
    const tail = c.error ? `<span class="err">${esc(c.error)}</span>` : `<span class="res">${esc(c.summary || "完成")}</span>`;
    return `<div class="call"><span class="fn">${esc(c.name)}</span><span class="arg">${esc(argText(c.arguments))}</span>${tail}</div>`;
  }).join("");
  return `<div class="step">${step.content ? `<div class="say">${esc(step.content)}</div>` : ""}${calls}</div>`;
}

function renderSide(s) {
  const mem = $("memory"), rec = $("recommended"), exc = $("excluded");
  if (!s) { mem.textContent = rec.textContent = exc.textContent = "—"; return; }
  const m = s.memory || {};
  const parts = [];
  for (const kind of ["positive", "negative", "read", "note"]) {
    const items = m[kind] || [];
    if (items.length) parts.push(`<div><span class="kind">${KIND[kind]}</span>${items.map((e) => `<span class="tag${e.persistent ? "" : " off"}" title="${e.persistent ? "长期" : "仅本次"}">${esc(e.value)}</span>`).join("")}</div>`);
  }
  mem.innerHTML = parts.join("") || '<span class="empty">—</span>';
  const r = (s.state && s.state.recommended) || [];
  rec.innerHTML = r.length ? `<ol class="recs-list">${r.map((x) => `<li><a class="book" data-id="${esc(x.novel_id)}">${esc(bare(x.title) || x.novel_id)}</a></li>`).join("")}</ol>` : '<span class="empty">—</span>';
  const x = (s.state && s.state.excluded) || [];
  exc.innerHTML = x.length ? x.map((id) => `<span class="tag off">${esc((s.state.shown || {})[id] || id)}</span>`).join("") : '<span class="empty">—</span>';
}

async function send(text) {
  const s = state.current;
  if (!s || state.busy || !text.trim()) return;
  state.busy = true;
  $("input").disabled = $("send").disabled = true;
  const log = $("log");
  if (!s.turns.length) log.innerHTML = "";
  log.appendChild(userBubble(text));
  const pending = { steps: [], termination: "", structured: null };
  let bubble = agentBubble(pending, true);
  log.appendChild(bubble);
  log.scrollTop = log.scrollHeight;
  const swap = (fresh) => { bubble.replaceWith(fresh); bubble = fresh; log.scrollTop = log.scrollHeight; };
  try {
    const r = await fetch(`/api/sessions/${s.id}/messages`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, idx); buf = buf.slice(idx + 2);
        let event = "message", data = "";
        for (const line of block.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (!data) continue;
        const payload = JSON.parse(data);
        if (event === "step") { pending.steps.push(payload); swap(agentBubble(pending, true)); }
        else if (event === "turn") {
          state.current = payload.session;
          swap(agentBubble(payload.turn));
          renderSide(payload.session);
          $("title").textContent = payload.session.title || "新会话";
        } else if (event === "error") swap(agentBubble({ ...pending, answer: "", error: payload.message, termination: "error" }));
      }
    }
  } catch (e) {
    swap(agentBubble({ ...pending, answer: "", error: e.message, termination: "error" }));
  } finally {
    state.busy = false;
    $("input").disabled = $("send").disabled = false;
    $("input").focus();
    loadSessions();
  }
}

const bookCache = {};
async function openBook(id, why) {
  const panel = $("panel"), body = $("panel-body");
  panel.classList.add("open");
  body.innerHTML = '<div class="empty">…</div>';
  try {
    const b = bookCache[id] || (bookCache[id] = await api(`/api/books/${id}`));
    const c = b.card || {};
    const styleRows = Object.entries(c.style || {}).filter(([, v]) => v);
    const cardRows = [["主角", c.protagonist], ["背景", c.setting], ["气质", c.tone], ["一句话", c.one_liner]].filter(([, v]) => v);
    const row = ([k, v]) => `<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`;
    body.innerHTML = `
      <h3>${esc(bare(b.title) || id)}</h3>
      <div class="genre">${esc(c.genre || "")}${c.subgenre ? " · " + esc(c.subgenre) : ""}</div>
      ${why ? `<div class="why">${esc(why)}</div>` : ""}
      ${(c.elements || []).length ? `<div class="sec-el"><h4>元素</h4><div>${c.elements.map((e) => `<span class="tag">${esc(e)}</span>`).join("")}</div></div>` : ""}
      ${styleRows.length ? `<div class="sec-style"><h4>风格</h4>${styleRows.map(row).join("")}</div>` : ""}
      ${cardRows.length ? `<div class="sec-card"><h4>概要</h4>${cardRows.map(row).join("")}</div>` : ""}
      ${b.blurb ? `<div class="sec-blurb"><h4>简介</h4><div class="blurb">${esc(b.blurb)}</div></div>` : ""}
      ${!b.card && !b.blurb ? '<div class="empty">这本书没有书卡</div>' : ""}`;
  } catch (e) { body.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
$("panel-close").onclick = () => $("panel").classList.remove("open");
document.addEventListener("click", (ev) => {
  const a = ev.target.closest("a.book");
  if (a) { ev.preventDefault(); openBook(a.dataset.id, a.dataset.why); }
  else if (!ev.target.closest("#panel")) $("panel").classList.remove("open");
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") $("panel").classList.remove("open"); });

$("new").onclick = newSession;
$("form").onsubmit = (ev) => { ev.preventDefault(); const t = $("input").value; $("input").value = ""; send(t); };
$("input").onkeydown = (ev) => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("form").requestSubmit(); } };

(async () => {
  await loadInfo();
  await loadSessions();
  if (state.sessions.length) await openSession(state.sessions[0].id);
})();
</script>
</body>
</html>
