<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网文 agent</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --line: #e4e1d9; --text: #1f1d1a; --muted: #6f6a60;
    --accent: #8a4b1e; --accent-soft: #f3e6da; --user: #e9efe4; --warn: #b4452c; --ok: #3c7a4a; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --panel: #1f1e1b; --line: #33312c; --text: #ebe7df; --muted: #9b958a; --accent: #d7a070; --accent-soft: #3a2b1f; --user: #26302a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; height: 100vh; display: grid; grid-template-columns: 260px 1fr 300px; }
  aside, section, main { min-height: 0; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .brand { padding: 18px 16px 10px; font-weight: 600; font-size: 16px; }
  .brand small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .new { margin: 6px 12px 10px; padding: 9px 12px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 8px; cursor: pointer; font-size: 14px; }
  .sessions { overflow-y: auto; flex: 1; }
  .session { padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; display: flex; gap: 8px; align-items: flex-start; }
  .session:hover { background: var(--bg); }
  .session.active { background: var(--accent-soft); }
  .session .t { flex: 1; min-width: 0; }
  .session .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .session .meta { color: var(--muted); font-size: 12px; }
  .session .del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 2px; }
  .session .del:hover { color: var(--warn); }
  main { display: flex; flex-direction: column; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .info { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 820px; }
  .msg.user { align-self: flex-end; background: var(--user); padding: 10px 14px; border-radius: 12px 12px 2px 12px; white-space: pre-wrap; }
  .msg.agent { align-self: flex-start; width: 100%; }
  .answer { background: var(--panel); border: 1px solid var(--line); border-radius: 12px 12px 12px 2px; padding: 12px 16px; white-space: pre-wrap; }
  .answer.asks { border-color: var(--accent); }
  .recs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 10px; }
  .rec { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .rec .name { font-weight: 600; }
  .rec .id { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .rec .why { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .cites { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .trace { margin-top: 8px; font-size: 13px; }
  .trace summary { color: var(--muted); cursor: pointer; user-select: none; }
  .step { margin: 6px 0 0 8px; padding-left: 10px; border-left: 2px solid var(--line); }
  .step .say { color: var(--muted); white-space: pre-wrap; }
  .call { font-family: var(--mono); font-size: 12px; margin: 3px 0; word-break: break-all; }
  .call .fn { color: var(--accent); }
  .call .res { color: var(--muted); font-family: inherit; }
  .call .err { color: var(--warn); }
  .status { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .status.bad { color: var(--warn); }
  .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  form { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; resize: none; height: 64px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: var(--bg); color: var(--text); }
  button.send { padding: 0 22px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: default; }
  section.side { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px; font-size: 13px; }
  section.side h2 { font-size: 13px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  section.side h2:first-child { margin-top: 0; }
  .tag { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 8px; margin: 2px 4px 2px 0; }
  .tag.off { background: var(--user); color: var(--muted); }
  ol.recs-list { margin: 0; padding-left: 20px; }
  .empty { color: var(--muted); }
  .welcome { margin: auto; color: var(--muted); text-align: center; max-width: 480px; }
  @media (max-width: 1000px) { body { grid-template-columns: 220px 1fr; } section.side { display: none; } }
  @media (max-width: 640px) { body { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<aside>
  <div class="brand">网文 agent<small id="model">连接中…</small></div>
  <button class="new" id="new">＋ 新会话</button>
  <div class="sessions" id="sessions"></div>
</aside>
<main>
  <header><h1 id="title">—</h1><span class="info" id="hinfo"></span></header>
  <div class="log" id="log"><div class="welcome">每个会话有自己的记忆和上下文。换一类书，就新开一个会话。</div></div>
  <form id="form">
    <textarea id="input" placeholder="比如：推荐几本凡人流的仙侠，别带后宫。Enter 发送，Shift+Enter 换行" disabled></textarea>
    <button class="send" id="send" type="submit" disabled>发送</button>
  </form>
</main>
<section class="side">
  <h2>记忆</h2><div id="memory" class="empty">—</div>
  <h2>本会话已推荐</h2><div id="recommended" class="empty">—</div>
  <h2>已排除</h2><div id="excluded" class="empty">—</div>
</section>
<script>
const $ = (id) => document.getElementById(id);
const state = { sessions: [], current: null, busy: false };
const KIND = { positive: "偏好", negative: "不要", read: "已读", note: "备注" };

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (r.status === 204) return null;
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const when = (iso) => iso ? new Date(iso).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";

async function loadInfo() {
  try {
    const info = await api("/api/info");
    $("model").textContent = info.model || "";
    $("hinfo").textContent = `${info.searcher || ""} · ${info.profiles || 0} 本 · ${info.cards || 0} 张书卡`;
  } catch (e) { $("model").textContent = "服务不可用"; }
}

async function loadSessions() {
  state.sessions = (await api("/api/sessions")).sessions;
  renderSessions();
}
function renderSessions() {
  const box = $("sessions");
  box.innerHTML = "";
  for (const s of state.sessions) {
    const el = document.createElement("div");
    el.className = "session" + (state.current && s.id === state.current.id ? " active" : "");
    el.innerHTML = `<div class="t"><div class="title">${esc(s.title || "新会话")}</div><div class="meta">${s.turns} 轮 · ${when(s.updated_at)}</div></div><button class="del" title="删除会话">×</button>`;
    el.querySelector(".t").onclick = () => openSession(s.id);
    el.querySelector(".del").onclick = async (ev) => {
      ev.stopPropagation();
      if (!confirm(`删除会话「${s.title || "新会话"}」？记忆和记录一起删除。`)) return;
      await api(`/api/sessions/${s.id}`, { method: "DELETE" });
      if (state.current && state.current.id === s.id) { state.current = null; renderSession(); }
      await loadSessions();
    };
    box.appendChild(el);
  }
}

async function newSession() {
  const s = await api("/api/sessions", { method: "POST", body: "{}" });
  await loadSessions();
  await openSession(s.id);
  $("input").focus();
}
async function openSession(id) {
  state.current = await api(`/api/sessions/${id}`);
  renderSessions();
  renderSession();
}

function renderSession() {
  const s = state.current;
  const log = $("log");
  $("title").textContent = s ? (s.title || "新会话") : "—";
  $("input").disabled = $("send").disabled = !s || state.busy;
  log.innerHTML = "";
  if (!s) { log.innerHTML = '<div class="welcome">每个会话有自己的记忆和上下文。换一类书，就新开一个会话。</div>'; renderSide(null); return; }
  if (!s.turns.length) log.innerHTML = '<div class="welcome">新会话。说说你想看什么。</div>';
  for (const t of s.turns) { log.appendChild(userBubble(t.user)); log.appendChild(agentBubble(t)); }
  renderSide(s);
  log.scrollTop = log.scrollHeight;
}

function userBubble(text) { const d = document.createElement("div"); d.className = "msg user"; d.textContent = text; return d; }

function agentBubble(turn, live = false) {
  const d = document.createElement("div");
  d.className = "msg agent";
  const st = turn.structured || {};
  const recs = (st.recommendations || []).map((r) => `<div class="rec"><div class="name">${esc(r.title || r.novel_id)}</div><div class="id">${esc(r.novel_id)}</div>${r.reason ? `<div class="why">${esc(r.reason)}</div>` : ""}</div>`).join("");
  const cites = (st.citations || []).map((c) => `${esc(c.novel_id)} · ${esc(c.chapter)}`).join("；");
  const bad = turn.termination && turn.termination !== "finish";
  const tokens = turn.prompt_tokens != null ? `${turn.prompt_tokens}+${turn.completion_tokens} tok` : "";
  d.innerHTML = `
    ${live ? "" : `<div class="answer${st.asks_user ? " asks" : ""}">${esc(turn.answer || (turn.error ? "（出错：" + turn.error + "）" : "（没有回答）"))}</div>`}
    ${recs ? `<div class="recs">${recs}</div>` : ""}
    ${cites ? `<div class="cites">引用：${cites}</div>` : ""}
    <details class="trace" ${live ? "open" : ""}><summary>${live ? '<span class="live"></span>处理中' : "过程"} · ${turn.steps.length} 步${tokens ? " · " + tokens : ""}${turn.elapsed_s ? " · " + turn.elapsed_s + " s" : ""}</summary><div class="steps">${turn.steps.map(stepHtml).join("")}</div></details>
    ${bad ? `<div class="status bad">结束方式：${esc(turn.termination)}${turn.error ? " · " + esc(turn.error) : ""}</div>` : ""}`;
  return d;
}
function stepHtml(step) {
  const calls = step.calls.map((c) => {
    const args = JSON.stringify(c.arguments ?? {});
    const tail = c.error ? `<span class="err">✗ ${esc(c.error)}</span>` : `<span class="res">→ ${esc(c.summary || "ok")}</span>`;
    return `<div class="call"><span class="fn">${esc(c.name)}</span>(${esc(args.length > 160 ? args.slice(0, 159) + "…" : args)}) ${tail}${c.latency_s != null ? ` <span class="res">${c.latency_s}s</span>` : ""}</div>`;
  }).join("");
  return `<div class="step">${step.content ? `<div class="say">${esc(step.content)}</div>` : ""}${calls}</div>`;
}

function renderSide(s) {
  const mem = $("memory"), rec = $("recommended"), exc = $("excluded");
  if (!s) { mem.textContent = rec.textContent = exc.textContent = "—"; return; }
  const m = s.memory || {};
  const parts = [];
  for (const kind of ["positive", "negative", "read", "note"]) {
    const items = m[kind] || [];
    if (items.length) parts.push(`<div><b>${KIND[kind]}</b> ${items.map((e) => `<span class="tag${e.persistent ? "" : " off"}" title="${e.persistent ? "长期" : "仅本次"}">${esc(e.value)}</span>`).join("")}</div>`);
  }
  mem.innerHTML = parts.join("") || '<span class="empty">还没有记住什么</span>';
  const r = (s.state && s.state.recommended) || [];
  rec.innerHTML = r.length ? `<ol class="recs-list">${r.map((x) => `<li>${esc(x.title || x.novel_id)}</li>`).join("")}</ol>` : '<span class="empty">—</span>';
  const x = (s.state && s.state.excluded) || [];
  exc.innerHTML = x.length ? x.map((id) => `<span class="tag off">${esc((s.state.shown || {})[id] || id)}</span>`).join("") : '<span class="empty">—</span>';
}

async function send(text) {
  const s = state.current;
  if (!s || state.busy || !text.trim()) return;
  state.busy = true;
  $("input").disabled = $("send").disabled = true;
  const log = $("log");
  if (!s.turns.length) log.innerHTML = "";
  log.appendChild(userBubble(text));
  const pending = { steps: [], termination: "", structured: null };
  let bubble = agentBubble(pending, true);
  log.appendChild(bubble);
  log.scrollTop = log.scrollHeight;
  try {
    const r = await fetch(`/api/sessions/${s.id}/messages`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, idx); buf = buf.slice(idx + 2);
        let event = "message", data = "";
        for (const line of block.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (!data) continue;
        const payload = JSON.parse(data);
        if (event === "step") {
          pending.steps.push(payload);
          const fresh = agentBubble(pending, true);
          bubble.replaceWith(fresh); bubble = fresh;
          log.scrollTop = log.scrollHeight;
        } else if (event === "turn") {
          state.current = payload.session;
          const fresh = agentBubble(payload.turn);
          bubble.replaceWith(fresh); bubble = fresh;
          renderSide(payload.session);
          $("title").textContent = payload.session.title || "新会话";
        } else if (event === "error") {
          const fresh = agentBubble({ ...pending, answer: "", error: payload.message, termination: "error" });
          bubble.replaceWith(fresh); bubble = fresh;
        }
      }
    }
  } catch (e) {
    bubble.replaceWith(agentBubble({ ...pending, answer: "", error: e.message, termination: "error" }));
  } finally {
    state.busy = false;
    $("input").disabled = $("send").disabled = false;
    $("input").focus();
    log.scrollTop = log.scrollHeight;
    loadSessions();
  }
}

$("new").onclick = newSession;
$("form").onsubmit = (ev) => { ev.preventDefault(); const t = $("input").value; $("input").value = ""; send(t); };
$("input").onkeydown = (ev) => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("form").requestSubmit(); } };

(async () => {
  await loadInfo();
  await loadSessions();
  if (state.sessions.length) await openSession(state.sessions[0].id);
})();
</script>
</body>
</html>
